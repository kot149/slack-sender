[project]
name = "slack-sender"
version = "0.1.0"
description = "CLI to send preset Slack posts defined in config.json."
requires-python = ">=3.11"
dependencies = [
  "json5>=0.15.0",
  "slack-sdk>=3.27",
]

[project.scripts]
slack-sender = "slack_sender.notify:main"
slack-sender-setup = "slack_sender.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_sender"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
